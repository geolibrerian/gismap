name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application version references
        run: |
          VERSION_NUMBER="$(tr -d '\r\n' < VERSION)"
          grep -Fq "css/app.css?v=${VERSION_NUMBER}" index.html
          grep -Fq "js/app.js?v=${VERSION_NUMBER}" index.html
          grep -Fq "events.js?v=${VERSION_NUMBER}" js/app.js
          grep -Fq "catalog.js?v=${VERSION_NUMBER}" js/ui.js
          grep -Fq "share.js?v=${VERSION_NUMBER}" js/app.js
          grep -Fq "share.js?v=${VERSION_NUMBER}" js/ui.js
          grep -Fq "markdown.js?v=${VERSION_NUMBER}" js/ui.js
          grep -Fq "export-worker.js?v=${VERSION_NUMBER}" js/export/export-controller.js

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/map.js
          node --check js/ui.js
          node --check js/attribute-table.js
          node --check js/auth.js
          node --check js/export/export-core.js
          node --check js/export/export-controller.js
          node --check js/export/export-worker.js
          node --check js/share.js
          node --check js/markdown.js
          node --check js/catalog.js
          node --check scripts/build-examples.mjs

      - name: Verify generated examples and guides
        run: node scripts/build-examples.mjs --check

      - name: Verify discovery files
        run: |
          test -f robots.txt
          test -f sitemap.xml

      - name: Run tests
        run: node --test tests/*.test.mjs
