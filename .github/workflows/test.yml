name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Entry points and imported modules use independent cache versions so a
      # focused change does not invalidate the entire application graph.
      - name: Verify cache-busted application references
        run: |
          grep -Eq 'css/app\.css\?v=[0-9]+\.[0-9]+\.[0-9]+' index.html
          grep -Eq 'js/app\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' index.html
          grep -Eq 'events\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/app.js
          grep -Eq 'catalog\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/ui.js
          grep -Eq 'share\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/app.js
          grep -Eq 'share\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/ui.js
          grep -Eq 'markdown\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/ui.js
          grep -Eq 'export-worker\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' js/export/export-controller.js

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/map.js
          node --check js/ui.js
          node --check js/attribute-table.js
          node --check js/auth.js
          node --check js/export/export-core.js
          node --check js/export/export-controller.js
          node --check js/export/export-worker.js
          node --check js/share.js
          node --check js/markdown.js
          node --check js/catalog.js
          node --check scripts/build-examples.mjs
          node --check scripts/site-outputs.mjs
          node --check scripts/agent-docs.mjs
          node --check scripts/ai-examples.mjs
          node --check scripts/workflow-examples.mjs

      - name: Verify generated examples and guides
        run: node scripts/build-examples.mjs --check

      - name: Verify discovery files
        run: |
          test -f robots.txt
          test -f sitemap.xml

      - name: Run tests
        run: node --test tests/*.test.mjs
