<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GISMap API explorer</title><link rel="stylesheet" href="../../css/content.css"><style>
main{max-width:90rem;margin:auto;padding:1.5rem} .grid-api{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem} iframe{width:100%;height:65vh;border:1px solid #9aa;border-radius:.5rem} pre{max-height:60vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#102e28;color:#f6f5e8;padding:1rem;border-radius:.5rem} button{padding:.6rem 1rem;cursor:pointer} @media(max-width:700px){.grid-api{grid-template-columns:1fr}iframe{height:45vh}}
</style></head><body><main><h1>Application API explorer</h1><p>This opens a separate GISMap session below. State excludes feature records, coordinates, source URLs, filter values and credentials. It is not a complete project export.</p><p><a href="../manifest.json">Static manifest</a> · <a href="../../">Open GISMap</a></p><div class="grid-api"><section><h2>Live session</h2><iframe id="app" title="GISMap session" src="../../" allow="geolocation"></iframe></section><section><h2>Inspect</h2><p id="status" role="status">Waiting for GISMap…</p><button id="manifest" type="button" disabled>Manifest</button> <button id="state" type="button" disabled>State</button> <button id="actions" type="button" disabled>Actions</button><p><label for="action-search">Search actions</label> <input id="action-search" type="search" placeholder="Name or ID" disabled></p><pre id="output" aria-live="polite"></pre></section></div></main><script type="module">
const frame = document.querySelector('#app'), status = document.querySelector('#status'), output = document.querySelector('#output');
frame.addEventListener('load', async () => {
  try {
    const api = await new Promise((resolve, reject) => {
      const started = Date.now();
      const poll = () => {
        if (frame.contentWindow.gisMapOnline) return resolve(frame.contentWindow.gisMapOnline);
        if (frame.contentDocument?.documentElement.dataset.gismapState === 'error' || Date.now() - started > 30000) return reject(new Error('GISMap could not initialize.'));
        setTimeout(poll, 100);
      };
      poll();
    });
    await api.ready;
    const showState = () => { output.textContent = JSON.stringify(api.state.snapshot(), null, 2); };
    const showManifest = () => { output.textContent = JSON.stringify(api.manifest(), null, 2); };
    const search = document.querySelector('#action-search');
    const showActions = () => { const q = search.value.trim().toLowerCase(); output.textContent = JSON.stringify(api.actions.list().filter((a) => `${a.id} ${a.displayName} ${a.description}`.toLowerCase().includes(q)), null, 2); };
    document.querySelector('#state').onclick = showState;
    document.querySelector('#manifest').onclick = showManifest;
    document.querySelector('#actions').onclick = showActions;
    document.querySelectorAll('button, #action-search').forEach((element) => { element.disabled = false; });
    status.textContent = 'Ready. The state view refreshes when the public projection changes.';
    let mode = 'state';
    document.querySelector('#state').addEventListener('click', () => { mode = 'state'; });
    document.querySelector('#manifest').addEventListener('click', () => { mode = 'manifest'; });
    document.querySelector('#actions').addEventListener('click', () => { mode = 'actions'; });
    search.addEventListener('input', () => { mode = 'actions'; showActions(); });
    api.state.subscribe(() => { if (mode === 'state') showState(); });
    showState();
  } catch (error) { status.textContent = `Unable to open the live session: ${error.message}`; }
});
</script></body></html>
